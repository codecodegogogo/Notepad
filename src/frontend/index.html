<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>/* __CSS__ */</style>
</head>
<body>
  <div id="titlebar">
    <div class="titlebar-actions">
      <button id="btn-new" title="New (Ctrl+N)">
        <svg viewBox="0 0 1024 1024" fill="currentColor"><path fill-rule="evenodd" d="M298.666667 85.333333h268.8a85.333333 85.333333 0 0 1 60.330666 24.996667l161.536 161.536A85.333333 85.333333 0 0 1 810.666667 332.8V853.333333a85.333333 85.333333 0 0 1-85.333334 85.333334H298.666667a85.333333 85.333333 0 0 1-85.333334-85.333334V170.666667a85.333333 85.333333 0 0 1 85.333334-85.333334z m213.333333 341.333334a42.666667 42.666667 0 0 0-42.666667 42.666666v64h-64a42.666667 42.666667 0 1 0 0 85.333334h64v64a42.666667 42.666667 0 1 0 85.333334 0v-64h64a42.666667 42.666667 0 1 0 0-85.333334h-64v-64a42.666667 42.666667 0 0 0-42.666667-42.666666z"/></svg>
      </button>
      <button id="btn-open" title="Open (Ctrl+O)">
        <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M369.066667 128a42.666667 42.666667 0 0 1 30.762666 13.098667l56.917334 59.136a42.666667 42.666667 0 0 0 30.72 13.098666H853.333333a85.333333 85.333333 0 0 1 85.333334 85.333334v512a85.333333 85.333333 0 0 1-85.333334 85.333333H170.666667a85.333333 85.333333 0 0 1-85.333334-85.333333V213.333333a85.333333 85.333333 0 0 1 85.333334-85.333333h198.4z m377.6 256h-469.333334a42.666667 42.666667 0 1 0 0 85.333333h469.333334a42.666667 42.666667 0 0 0 0-85.333333z"/></svg>
      </button>
      <button id="btn-save" title="Save (Ctrl+S)">
        <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M469.333333 128h85.333334a42.666667 42.666667 0 0 1 42.666666 42.666667v266.666666h100.906667a42.666667 42.666667 0 0 1 31.146667 71.850667l-186.88 199.253333a42.666667 42.666667 0 0 1-62.293334 0l-186.88-199.253333A42.666667 42.666667 0 0 1 325.12 437.333333H426.666667V170.666667A42.666667 42.666667 0 0 1 469.333333 128z"/><path d="M170.666667 640a42.666667 42.666667 0 0 1 42.666666 42.666667v128h597.333334v-128a42.666667 42.666667 0 1 1 85.333333 0v149.333333a64 64 0 0 1-64 64H192a64 64 0 0 1-64-64V682.666667a42.666667 42.666667 0 0 1 42.666667-42.666667z"/></svg>
      </button>
      <div class="titlebar-sep"></div>
      <button id="btn-toggle" title="Toggle Preview (Ctrl+E)">
        <svg id="icon-preview" viewBox="0 0 1024 1024" fill="currentColor"><path fill-rule="evenodd" d="M512 213.333333c184.746667 0 340.906667 99.555556 426.666667 298.666667-85.76 199.111111-241.92 298.666667-426.666667 298.666667S171.093333 711.111111 85.333333 512C171.093333 312.888889 327.253333 213.333333 512 213.333333z m0 106.666667a192 192 0 1 0 0 384 192 192 0 0 0 0-384z"/><path d="M512 405.333333a106.666667 106.666667 0 1 1 0 213.333334 106.666667 106.666667 0 0 1 0-213.333334z"/></svg>
        <svg id="icon-edit" viewBox="0 0 1024 1024" fill="currentColor" style="display:none"><path d="M723.626667 453.162667L348.245333 895.061333a64 64 0 0 1-38.016 21.674667l-121.045333 20.650667A42.666667 42.666667 0 0 1 139.392 896L137.472 772.266667a64 64 0 0 1 15.232-42.410667l374.826667-441.258667 196.053333 164.522667z m144.810666-269.909334a64 64 0 0 1 7.893334 90.154667l-0.256 0.298667-97.237334 114.432L582.826667 223.573333l97.706666-115.029333a64 64 0 0 1 89.898667-7.594667l98.048 82.261334z"/></svg>
      </button>
      <button id="btn-split" title="Split View (Ctrl+\)">
        <svg viewBox="0 0 1024 1024" fill="currentColor"><path fill-rule="evenodd" d="M170.666667 149.333333h682.666666a85.333333 85.333333 0 0 1 85.333334 85.333334v554.666666a85.333333 85.333333 0 0 1-85.333334 85.333334H170.666667a85.333333 85.333333 0 0 1-85.333334-85.333334V234.666667a85.333333 85.333333 0 0 1 85.333334-85.333334z m0 85.333334v554.666666h298.666666V234.666667H170.666667z m384 0v554.666666h298.666666V234.666667H554.666667z"/></svg>
      </button>
      <button id="btn-toc" title="Outline (Ctrl+Shift+O)">
        <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M768 85.333333a85.333333 85.333333 0 0 1 85.333333 85.333334v682.666666a85.333333 85.333333 0 0 1-85.333333 85.333334H256a85.333333 85.333333 0 0 1-85.333333-85.333334V170.666667a85.333333 85.333333 0 0 1 85.333333-85.333334h512z m-298.666667 341.333334H341.333333a42.666667 42.666667 0 0 0 0 85.333333h128a42.666667 42.666667 0 0 0 0-85.333333z m213.333334-170.666667H341.333333a42.666667 42.666667 0 1 0 0 85.333333h341.333334a42.666667 42.666667 0 0 0 0-85.333333z"/></svg>
      </button>
    </div>
    <span id="titlebar-title">Untitled</span>
    <div id="window-controls">
      <button id="btn-theme" title="Toggle Theme">
        <svg id="icon-sun" viewBox="0 0 1024 1024" fill="currentColor" style="display:none"><circle cx="512" cy="512" r="181.333333"/><rect x="469.333333" y="85.333333" width="85.333333" height="128" rx="42.666667"/><rect x="469.333333" y="810.666667" width="85.333333" height="128" rx="42.666667"/><rect x="85.333333" y="469.333333" width="128" height="85.333333" rx="42.666667"/><rect x="810.666667" y="469.333333" width="128" height="85.333333" rx="42.666667"/><rect x="469.333333" y="85.333333" width="85.333333" height="128" rx="42.666667" transform="rotate(45 512 512)"/><rect x="469.333333" y="85.333333" width="85.333333" height="128" rx="42.666667" transform="rotate(135 512 512)"/><rect x="469.333333" y="85.333333" width="85.333333" height="128" rx="42.666667" transform="rotate(225 512 512)"/><rect x="469.333333" y="85.333333" width="85.333333" height="128" rx="42.666667" transform="rotate(315 512 512)"/></svg>
        <svg id="icon-moon" viewBox="0 0 1024 1024" fill="currentColor"><path d="M864 544a352 352 0 0 1-384-384 352 352 0 1 0 384 384z"/></svg>
      </button>
      <div class="window-controls-sep"></div>
      <button id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 10 10"><line x1="2" y1="5" x2="8" y2="5"/></svg>
      </button>
      <button id="btn-maximize" title="Maximize">
        <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg>
      </button>
      <button id="btn-close" title="Close">
        <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
      </button>
    </div>
  </div>

  <div id="tab-bar"></div>

  <div id="find-bar">
    <input id="find-input" type="text" placeholder="Find..." spellcheck="false">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous (Shift+Enter)">
      <svg viewBox="0 0 10 10"><polyline points="2,7 5,3 8,7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-next" title="Next (Enter)">
      <svg viewBox="0 0 10 10"><polyline points="2,3 5,7 8,3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-close" title="Close (Escape)">
      <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
    </button>
  </div>

  <div id="content">
    <div id="toc-panel">
      <div id="toc-list"></div>
    </div>
    <div id="editor-container" class="active">
      <div id="recent-panel"></div>
      <textarea id="editor" placeholder="Start writing markdown..." spellcheck="false"></textarea>
    </div>

    <div id="preview-container">
      <div id="preview-wrapper">
        <div id="preview"></div>
        <div id="preview-resize-handle"></div>
      </div>
    </div>
  </div>

  <div id="zoom-toast"></div>

  <div id="drop-overlay">
    <div class="drop-message">Drop to open</div>
  </div>

  <div id="statusbar">
    <span id="status-mode">EDIT</span>
    <span id="status-file">Untitled</span>
    <span id="status-counts"></span>
    <span id="status-info"></span>
  </div>

  <!-- __SCRIPTS__ -->
</body>
</html>
